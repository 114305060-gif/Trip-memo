<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[地點標題]｜Trip Memo 旅途手帳</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <nav class="back-nav">
      <a href="../index.html">← 返回 Trip Memo 旅途手帳首頁</a>
    </nav>

    <article class="article-sheet">
      <div class="card-tape"></div>
      <header class="article-header">
        <!-- 台灣國內請用 badge-tw；國外旅遊請用 badge-intl -->
        <span class="badge badge-tw">[台灣國內 或 國外旅遊]</span>
        <h1 class="article-title">[地點標題｜副標題]</h1>
        <p class="article-info">📍 地點：[國家 / 城市] ｜ 🗓️ 建議天數：[X天X夜]</p>
      </header>

      <section class="memo-section">
        <h2>行程亮點 Highlights</h2>
        <ul class="highlight-list">
          <li><strong>[亮點名稱 1]</strong>：[簡短特色說明]</li>
          <li><strong>[亮點名稱 2]</strong>：[簡短特色說明]</li>
          <li><strong>[亮點名稱 3]</strong>：[簡短特色說明]</li>
        </ul>
      </section>

      <section class="memo-section memo-text">
        <h2>手帳隨筆 Memo Notes</h2>
        <p>[第一段旅行紀錄與感受描述]</p>
        <p>[第二段美食、風景或難忘插曲紀錄]</p>
      </section>
    </article>

    <footer class="site-footer">
      <p>© 2026 Trip Memo 旅途手帳</p>
    </footer>
  </div>
</body>
</html>
